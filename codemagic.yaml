workflows:
  react-native-android:
    name: TRUTH Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      node: 20
      groups:
        - supabase
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild Android project
        script: npx expo prebuild --platform android
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk

  react-native-ios:
    name: TRUTH iOS IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - supabase
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild iOS project
        script: npx expo prebuild --platform ios
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build unsigned iOS archive
        script: |
          cd ios
          xcodebuild \
            -workspace TRUTH.xcworkspace \
            -scheme TRUTH \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/TRUTH.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive
      - name: Package unsigned IPA manually
