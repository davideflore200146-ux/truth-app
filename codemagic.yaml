workflows:
  react-native-android:
    name: TRUTH Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      groups:
        - supabase

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Prebuild Android project
        script: npx expo prebuild --platform android

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk

  react-native-ios:
    name: TRUTH iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      node: 20
      groups:
        - supabase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.davideflore.truth

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Prebuild iOS project
        script: npx expo prebuild --platform ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/TRUTH.xcworkspace \
            --scheme TRUTH

    artifacts:
      - build/ios/ipa/*.ipa
